<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>碧蓝航线 · 动态立绘预览 | 婚礼白</title>
  <meta name="description" content="碧蓝航线动态立绘（Spine 3.8）本地预览工具，婚礼白主题，支持搜索、动作切换、图层切换、缩放与截图。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='0.35' cy='0.28' r='0.9'%3E%3Cstop offset='0' stop-color='%23fffdf8'/%3E%3Cstop offset='0.55' stop-color='%23fdf1dd'/%3E%3Cstop offset='1' stop-color='%23e3c79b'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='50' fill='url(%23g)'/%3E%3Crect x='4' y='4' width='92' height='92' rx='46' fill='none' stroke='%23c9a86a' stroke-width='2'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23a9863f' font-family='Georgia,serif'%3E%E7%A2%A7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="theme-wedding-white">
  <div class="fx-layers" aria-hidden="true">
    <div class="fx-petals" id="fxPetals"></div>
    <div class="fx-bokeh" id="fxBokeh"></div>
    <div class="fx-shimmer" id="fxShimmer"></div>
  </div>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><span>碧</span></div>
        <div class="brand-text">
          <span class="brand-kicker">Azur Lane · Spine Gallery</span>
          <h1>动态立绘预览</h1>
          <p>azurlane_spinepainting</p>
        </div>
        <button class="icon-btn" id="closeSidebar" type="button" title="收起列表">✕</button>
      </div>

      <div class="side-ornament" aria-hidden="true">
        <span class="line"></span>
        <span class="gem"></span>
        <span class="ring"></span>
        <span class="gem"></span>
        <span class="line"></span>
      </div>

      <div class="search-box">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="search" type="search" placeholder="搜索舰娘 / 皮肤 / 目录名…" autocomplete="off" spellcheck="false">
        <button class="clear" id="clearSearch" type="button" title="清空">✕</button>
      </div>

      <div class="chips" id="chips"></div>

      <div class="list-head">
        <span id="listMeta">加载中…</span>
        <span id="listHint"></span>
      </div>

      <div class="ship-list" id="shipList"></div>

      <div class="side-foot">
        <span class="hint" id="sideHint">婚礼白 · 本地画廊</span>
        <a class="link" href="../index.html">资源索引</a>
      </div>
    </aside>

    <main class="stage">
      <div class="stage-veil" aria-hidden="true">
        <span class="veil-swag left"></span>
        <span class="veil-swag right"></span>
        <span class="veil-tassel left"></span>
        <span class="veil-tassel right"></span>
      </div>
      <div class="fx-burst" id="fxBurst" aria-hidden="true"></div>
      <div class="canvas-host" id="canvasHost"></div>

      <div class="stage-frame" aria-hidden="true">
        <span class="stud tl"></span>
        <span class="stud tr"></span>
        <span class="stud bl"></span>
        <span class="stud br"></span>
        <svg class="crown" viewBox="0 0 46 24" fill="none" stroke="rgba(201,168,106,0.7)" stroke-width="1.2"
          stroke-linecap="round">
          <path d="M23 2 L27 9 L34 5 L32 15 L46 13" opacity="0.45"></path>
          <path d="M23 2 L19 9 L12 5 L14 15 L0 13" opacity="0.45"></path>
          <circle cx="23" cy="2" r="1.8" fill="rgba(201,168,106,0.55)" stroke="none"></circle>
          <circle cx="34" cy="5" r="1.2" fill="rgba(235,196,210,0.8)" stroke="none"></circle>
          <circle cx="12" cy="5" r="1.2" fill="rgba(235,196,210,0.8)" stroke="none"></circle>
        </svg>
      </div>

      <div class="empty" id="empty">
        <div class="logo-big"><span>碧</span></div>
        <h2>选择一个舰娘，开始预览</h2>
        <p>左侧为资源索引，点击任意舰娘即可加载其 Spine 动态立绘。所有资源均直接读取仓库内的 <code>.skel / .atlas / .png</code>，浏览器本地实时渲染。</p>
        <div class="keys">
          <kbd>空格</kbd><kbd>A</kbd><kbd>D</kbd><kbd>←</kbd><kbd>→</kbd><kbd>R</kbd><kbd>S</kbd><kbd>H</kbd><kbd>F</kbd>
        </div>
      </div>

      <div class="topbar">
        <button class="icon-btn" id="openSidebar" type="button" title="展开列表">☰</button>
        <div class="crumbs" id="crumbs">
          <span class="crumb dim">请选择舰娘</span>
        </div>
      </div>

<div class="hud" id="hud"></div>

      <div class="local-notice" id="localNotice" hidden>
        <span class="ln-dot" aria-hidden="true"></span>
        <div class="ln-text">
          <strong>本地直开模式</strong>
          <span>索引与缩略图已就绪。若动态立绘无法加载，请改用仓库根目录的 <code>start-local-preview.cmd</code> 打开。</span>
        </div>
        <button class="ln-btn" id="localNoticeClose" type="button">知道了</button>
      </div>

      <div class="stage-bar">
        <span class="bar-ribbon left" aria-hidden="true"></span>
        <span class="bar-ribbon right" aria-hidden="true"></span>
        <div class="skin-strip" id="skinStrip"></div>

        <div class="controls" id="controls">
          <button class="ctl icon" id="btnPrevShip" type="button" title="上一个舰娘">⏮</button>
          <button class="ctl icon" id="btnToggle" type="button" title="播放 / 暂停（空格）">⏸</button>
          <button class="ctl icon" id="btnNextShip" type="button" title="下一个舰娘">⏭</button>

          <div class="popup">
            <button class="ctl" id="btnAnims" type="button" title="切换动作">
              <span class="label" id="animLabel">动作</span> ▾
            </button>
            <div class="popup-panel" id="animPanel">
              <div class="popup-head">Animation · 动作列表</div>
              <div class="popup-list" id="animList"></div>
            </div>
          </div>

          <div class="popup">
            <button class="ctl" id="btnSpines" type="button" title="切换图层（T/M/B 等）">
              <span class="label" id="spineLabel">图层</span> ▾
            </button>
            <div class="popup-panel" id="spinePanel">
              <div class="popup-head">Layers · 立绘图层</div>
              <div class="popup-list" id="spineList"></div>
            </div>
          </div>

          <button class="ctl icon" id="btnReset" type="button" title="重置视图与动作（R）">⟲</button>
          <button class="ctl icon" id="btnShot" type="button" title="保存当前画面为 PNG（S）">⤓</button>
          <button class="ctl icon" id="btnFull" type="button" title="全屏（F）">⛶</button>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </main>
  </div>

  <script src="./load-time-data.js"></script>
  <script src="./vendor/spine-player.js"></script>
  <script src="./app.js?v=20260930b"></script>
</body>

</html>
